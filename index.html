<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Matziv Screens</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      background: black;
      overflow: hidden;
      font-family: monospace, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <video autoplay muted loop playsinline>
    <source src="media/banquet.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <script>
    // Optional: refresh after 4 minutes
    setInterval(() => {
      location.reload(true);
    }, 240000); // 4 minutes
  </script>
</body>
</html>

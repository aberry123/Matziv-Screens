<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Matziv Screens</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      background: black;
      overflow: hidden;
      font-family: monospace, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .slide {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('media/judge.png') no-repeat center center;
      background-size: cover;
    }
  </style>
</head>
<body>
  <div class="slide"></div>

  <script>
    // Simple refresh every 4 minutes
    setInterval(() => {
      location.reload(true);
    }, 240000); // 4 minutes
  </script>
</body>
</html>
